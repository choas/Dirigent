services:
  sonarqube:
    container_name: dirigent_sonarqube
    # community (rolling) build — the lts-community image has no Rust analyzer
    image: sonarqube:community
    depends_on:
      db-sonarqube:
        condition: service_healthy
    ports:
      - "9006:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db-sonarqube:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data:Z
      - sonarqube_extensions:/opt/sonarqube/extensions:Z
      - sonarqube_logs:/opt/sonarqube/logs:Z
    networks:
      - dirigent-sonar-network

  db-sonarqube:
    container_name: dirigent_db-sonarqube
    image: postgres:15
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - sonarqube_db:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dirigent-sonar-network

networks:
  dirigent-sonar-network:
    name: dirigent-sonar-network
    driver: bridge

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db:
